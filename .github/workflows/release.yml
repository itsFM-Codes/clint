name: Release main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            source: target/release/clint
            asset: clint-linux-amd64
          - os: windows-latest
            source: target/release/clint.exe
            asset: clint-windows-amd64.exe
          - os: macos-latest
            source: target/release/clint
            asset: clint-macos-amd64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: Prepare asset
        run: python -c "import shutil; shutil.copy(r'${{ matrix.source }}', r'${{ matrix.asset }}')"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Set release tag
        id: release
        run: echo "tag=main${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: |
            release/clint-linux-amd64
            release/clint-windows-amd64.exe
            release/clint-macos-amd64
