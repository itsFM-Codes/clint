name: Release v1.1.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/v1.1.0',
              sha: '58847fdde03c10e79b143a548d61ec87c0c9c9b5'
            })

  release:
    needs: tag
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            source: target/release/clint
            asset: clint-linux-amd64
          - os: windows-latest
            source: target/release/clint.exe
            asset: clint-windows-amd64.exe
          - os: macos-latest
            source: target/release/clint
            asset: clint-macos-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 58847fdde03c10e79b143a548d61ec87c0c9c9b5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Prepare asset
        run: python -c "import shutil; shutil.copy(r'${{ matrix.source }}', r'${{ matrix.asset }}')"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: v1.1.0
          generate_release_notes: true
          files: ${{ matrix.asset }}
